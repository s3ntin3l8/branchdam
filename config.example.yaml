# branchDAM configuration — example.
#
# Copy to config.yaml and edit. Values may reference the environment with
# ${VAR}; keep real secrets (BRANCHDAM_AGENT_API_KEY, etc.) in a gitignored
# .env, never in this file. An unset ${VAR} is left as literal text rather
# than silently emptied, so a typo'd variable name fails loudly.

listenAddr: ":8080"
logLevel: info

database:
  path: /data/branchdam.db

http:
  readTimeoutSecs: 15
  writeTimeoutSecs: 15
  exposeOpenAPI: false            # expose /openapi.json and /docs (default false)
  # IP addresses or CIDR ranges of trusted reverse proxies.
  # X-Forwarded-* headers are only honored from these sources.
  # Default (unset): trust all (backward-compatible).
  # Set to [] (empty list) to deny all forwarded headers.
  # trustedProxies:
  #   - 10.0.0.0/8
  #   - 192.168.0.0/16
  #   - "*"  # trust all (same as unset)

workers:
  hashWorkers: 0                  # 0 = auto (min(4, NumCPU)); hashing is I/O
                                   # bound on a NAS, going wide thrashes disks
  fullHashPolicy: tier3_and_collision   # always | tier3_and_collision | never
  perceptualHash: true            # default true; disable to skip pHash extraction
                                   # (Tier-3 heuristic matching needs this on)

thumbnails:
  # JPEG thumbnail cache (internal/thumbs). cacheDir lives on the app's own
  # /data volume, NOT inside any storageLocations tier -- see
  # internal/thumbs' package doc for why it deliberately does not route
  # through storage.Guard. Must be absolute, same as database.path.
  enabled: true
  cacheDir: /data/thumbs
  maxEdgePx: 512                  # longest edge in pixels; never upscaled
  workers: 0                      # 0 = auto, same meaning as workers.hashWorkers
  intervalSecs: 0                 # 0 = worker's built-in default poll interval

pruning:
  # Global kill-switch for server-side cache pruning operations (POST /api/v1/prune).
  # Default is true.
  enabled: true

trash:
  # Number of days deleted files are kept in .trash/ before permanent purge (default 30).
  # 0 disables automatic purge.
  retentionDays: 30

ingest:
  # Centralized naming template for server-ingested media (POST /api/v1/agent/upload).
  namingTemplate: "{yyyy}/{yyyy}-{mm}-{dd}_{camera_model}/{original_name}"

agent:
  # Machine-principal key for /api/v1/agent/* routes, which bypass Authentik
  # ForwardAuth at the Traefik layer (see docs/forward-auth.md). Must be at
  # least 32 characters or agent routes fail closed with 503.
  apiKey: ${BRANCHDAM_AGENT_API_KEY}

authz:
  # Groups permitted admin (write) access on browser-routed endpoints.
  # Empty list (default) permits all authenticated users and logs a WARN at startup.
  groups:
    - branchdam-admins

immich:
  # External-library scan trigger (phase 7 #55). Leave apiUrl or libraryId
  # empty (or unresolved, as here) to disable the sync worker -- an empty
  # libraryId would otherwise 404 every push forever (#182). exportPath is
  # where Immich's external library mount indexes -- the worker enqueues
  # live nodes under it.
  apiUrl: ${IMMICH_API_URL}
  apiKey: ${IMMICH_API_KEY}
  libraryId: ${IMMICH_LIBRARY_ID}
  exportPath: /storage/exports/immich

# Operator-declared host-path -> container-path prefix rewrites for Tier-1
# project-file introspection (.dam.json, .drp, .fcpxml, .edl) -- without at
# least one matching rule, project files fall through to basename+size
# fallback matching only. See docs/project-paths.md for the full resolution
# strategy and docs/configuration.md for the field reference. Commented out
# by default -- uncomment and adjust to your editing workstations' paths.
# pathRewrites:
#   - from: "D:\\Footage\\"
#     to: "/storage/projects/Footage/"
#   - from: "/Volumes/Video/Projects/"
#     to: "/storage/projects/Video/"

# One entry per mounted storage tier. Tier must be one of:
#   TIER0_LOCAL_STAGING, TIER1_LOCAL_SCRATCH, TIER2_EXPORTS,
#   TIER3_MASTER_ARCHIVE, PROJECTS
# storage.Guard (PR 2) reads tier/readOnly from the seeded storage_locations
# table, never from a hardcoded path prefix — see docs/schema.md fix #1.
storageLocations:
  - name: archive
    rootPath: /storage/archive
    tier: TIER3_MASTER_ARCHIVE
    readOnly: true                # enforced in the DB CHECK too; Tier 3 is always read-only
    # watch and sweep are never honored here: the Tier 3 master archive is
    # read-only, so nothing on it can ever be ingested

  - name: staging
    rootPath: /storage/staging
    tier: TIER0_LOCAL_STAGING
    # Staging container root for branchdam-agent's offline ingest queue drain
    # (EVENT_NODE_CREATED before files rebase to Tier-3 archive). Needs no
    # real content on disk — an empty directory satisfies storage.Guard's
    # canonicalization; actual bytes reside on workstation local storage.
    # Per-machine subtree convention: /storage/staging/<agentId>/... to avoid
    # path collisions across multiple workstations.

  - name: exports
    rootPath: /storage/exports
    tier: TIER2_EXPORTS
    # watch: false                # continuous ingest is opt-in, off by default

  - name: projects
    rootPath: /storage/projects
    tier: PROJECTS

  - name: scratch
    rootPath: /storage/scratch
    tier: TIER1_LOCAL_SCRATCH
    prunable: true                # only Tier 1 may be prunable
    # cacheTtlHours is the age (by mtime, not scan recency) past which an
    # ACTIVE node here becomes eligible for TTL cache pruning (#61) --
    # provided it also has a verified full_hash on a Tier-3 location.
    # prunable alone does not imply a TTL: zero (the default) means
    # "never eligible". Setting this on a non-prunable location is a
    # startup config error.
    cacheTtlHours: 720             # 30 days
    # watch: false                # off by default
    watch: true                   # example: watch continuous ingest on working tiers

  - name: nas-share
    rootPath: /storage/nas-share
    tier: TIER2_EXPORTS
    # fsnotify does not fire reliably over SMB/NFS -- sweep is the polling
    # adjunct for those mounts instead of watch (#60).
    sweep: true
    sweepIntervalSecs: 600        # 10 minutes (the default; shown explicitly here)
