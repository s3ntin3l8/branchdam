# Codecov reads this file from the default branch (main), not from the PR
# that introduces it -- a PR adding/editing this file is itself still
# evaluated under whatever config is already on main.
#
# Flag-scoped project targets, not a single combined one: as of this change
# `go` sits at 75.71% and `node` at 62.69% (combined 74.63%). A flat 75%
# combined target would go red on day one purely because of the frontend gap,
# and averaging the two together would hide that gap rather than track it.
# `go`'s target matches where it already is; `node`'s target is set slightly
# above today's number to hold the line while frontend test coverage grows
# toward parity. The combined `project.default` status stays informational
# until the two flags are close enough together that a single number is
# meaningful. `patch` stays informational -- per-PR diff coverage is noisy
# enough (small PRs, generated sqlc code, etc.) that hard-failing on it would
# be noise rather than signal.
coverage:
  status:
    project:
      default:
        informational: true
      go:
        target: 75%
        flags:
          - go
      node:
        target: 60%
        flags:
          - node
    patch:
      default:
        target: 75%
        informational: true

# Matches the `flags:` values the shared ci-go.yml / ci-node.yml reusable
# workflows already upload coverage under (s3ntin3l8/.github).
flags:
  go:
    paths:
      - internal/
      - cmd/
  node:
    paths:
      - web/src/

comment:
  layout: "reach, diff, flags, files"
