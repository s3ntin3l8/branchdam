version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/db/sqlcgen"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: false
        overrides:
          - column: "media_nodes.fast_hash"
            go_type: { type: "string", pointer: true }
          - column: "media_nodes.full_hash"
            go_type: { type: "string", pointer: true }
          # v_media_edges_resolved's parent_alive/parent_missing are computed
          # boolean expressions over a view -- sqlc can't infer a type for
          # those (see docs/schema.md's sqlc risk note), so it's spelled out
          # here rather than left as interface{}.
          - column: "v_media_edges_resolved.parent_alive"
            go_type: "bool"
          - column: "v_media_edges_resolved.parent_missing"
            go_type: "bool"
