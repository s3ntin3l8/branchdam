name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Detects whether the frontend (PR 10) and Dockerfile (PR 11) exist yet.
  # hashFiles() is only callable from jobs.<id>.steps.*, not jobs.<id>.if
  # directly, so a job's own `if:` can't gate on it -- this job's step does
  # the check and publishes the result as an output the other jobs read.
  detect:
    name: Detect optional build inputs
    runs-on: ubuntu-latest
    outputs:
      has_web: ${{ steps.check.outputs.has_web }}
      has_dockerfile: ${{ steps.check.outputs.has_dockerfile }}
      docker_relevant: ${{ steps.docker-filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f web/package.json ]; then echo "has_web=true" >> "$GITHUB_OUTPUT"; else echo "has_web=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f Dockerfile ]; then echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"; else echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"; fi
      # Only consulted for pull_request events below -- push (merge to main)
      # always builds the edge image regardless of this output. Scopes the
      # PR-time Docker compile-check to PRs that could plausibly break the
      # image, instead of running it on every PR.
      - id: docker-filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'web/package-lock.json'

  backend:
    name: Go (build · vet · test)
    uses: s3ntin3l8/.github/.github/workflows/ci-go.yml@main
    with:
      # GO-2026-5932: golang.org/x/crypto/openpgp subpackage is unmaintained
      # and unsafe by design. We import x/crypto ONLY for argon2id
      # (internal/auth/users/users.go), never for openpgp -- govulncheck
      # flags the module, not our usage. Re-check periodically and drop
      # this ID if/when the upstream module drops the openpgp subpackage
      # or the advisory is otherwise resolved.
      govulncheck-ignore: GO-2026-5932
    secrets: inherit

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # web.Dist() (//go:embed) needs a real web/dist to resolve when
      # golangci-lint type-checks the package graph -- same stub ci-go.yml's
      # reusable workflow runs, kept in sync via the shared script.
      - run: bash .github/ci-prebuild.sh
      - uses: golangci/golangci-lint-action@v9
        with:
          # .golangci.yml declares `version: "2"`, which requires a v2.x
          # binary -- pin explicitly rather than floating to "latest" so a
          # future v3 release doesn't silently change what this job enforces.
          version: v2.12.2

  frontend:
    name: Web (typecheck · build)
    needs: [detect]
    # The SPA lands in PR 10 (see build plan). Until web/package.json exists,
    # this job has nothing to check out and cache-dependency-path would fail
    # the "Set up Node.js" step -- skip cleanly instead of going red on every
    # PR between now and then. Self-activates the moment PR 10 adds the file.
    if: needs.detect.outputs.has_web == 'true'
    uses: s3ntin3l8/.github/.github/workflows/ci-node.yml@main
    with:
      node-version: '24'
      working-directory: web
      cache-dependency-path: web/package-lock.json
      test-script: test:coverage
    secrets: inherit

  docker:
    name: Docker image build
    needs: [detect, backend, frontend]
    # Same reasoning as frontend's gate, for the Dockerfile PR 11 adds.
    # frontend may legitimately be 'skipped' (not yet applicable) rather than
    # 'success' -- only 'failure'/'cancelled' should block this job, so the
    # check is spelled out explicitly rather than relying on the default
    # `success()` job condition, which does NOT treat a skipped need as passing.
    #
    # The last clause is the PR-vs-merge split: push events (merge to main)
    # always run this job -- that's what publishes :edge -- while pull_request
    # events only run it when detect's paths-filter found a Docker-relevant
    # change (Dockerfile, go.mod/go.sum, web/package-lock.json). Every other PR
    # skips the image build entirely instead of compile-checking it on every push.
    if: |
      needs.backend.result == 'success' &&
      needs.frontend.result != 'failure' && needs.frontend.result != 'cancelled' &&
      needs.detect.outputs.has_dockerfile == 'true' &&
      (github.event_name == 'push' || needs.detect.outputs.docker_relevant == 'true')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: s3ntin3l8/.github/.github/workflows/docker-publish.yml@main
    with:
      image-name: ${{ github.repository }}
      # Build-only on PRs; build + push :edge (cosign-signed) on push to main.
      push-edge: ${{ github.event_name == 'push' }}
      # Keep PR validation fast (no arm64 emulation); full multi-arch only on edge push.
      # CGO is on (mattn/go-sqlite3, see docs/schema.md), so the arm64 leg genuinely
      # compiles C — deliberately excluded from the PR-fast lane, not just slow there.
      platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
      # Stamp the commit the image was built from into the embedded SPA via
      # BRANCHDAM_BUILD_ID, so Settings → "UI build" can warn about a stale
      # embedded SPA vs. a server that was rebuilt without rebuilding the SPA.
      # Matches Dockerfile:16 ARG BRANCHDAM_BUILD_ID=dev-docker.
      #
      # The PR leg's image is build-only (never pushed), so the stamp there
      # is never observed by anything running it -- only :edge and release
      # images reach an operator. The PR-time docker build is kept because
      # the paths-filter gate above ensures it runs only when a touched file
      # could plausibly break the image (Dockerfile, lockfiles, go.mod), and
      # it's the only CI leg that exercises the Dockerfile's actual build
      # flags (CGO_ENABLED=1, -trimpath, -X main.version) and the alpine
      # base. First real run of this line is the next push to main; the
      # docker job is SKIPPED on this PR because detect's paths-filter does
      # not match .github/workflows/*.
      #
      # docker-publish.yml's `build-args` is multiline key=value, one per
      # line.
      build-args: BRANCHDAM_BUILD_ID=${{ github.sha }}
    secrets: inherit
