name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze
    uses: s3ntin3l8/.github/.github/workflows/codeql.yml@main
    with:
      # javascript-typescript added back once PR 10 lands the SPA -- CodeQL
      # hard-fails (exit 32, "could not process any code") rather than
      # no-op'ing when a requested language has zero source files, unlike
      # the frontend/docker jobs in ci.yml, which detect and skip cleanly.
      languages: "go"
    permissions:
      actions: read
      contents: read
      security-events: write
