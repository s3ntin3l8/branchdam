version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns:
          - "*"
    ignore:
      # typescript-eslint@8 peers `typescript >=4.8.4 <6.1.0`; TS 7 (and 6.1+)
      # break `npm ci` at resolution. Lift when typescript-eslint ships TS 7
      # support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
